services:
  mongo:
    image: mongo:7.0
    container_name: vendor-vogue-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --port 27017 --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }" --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local
